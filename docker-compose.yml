services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalhound
      POSTGRES_USER: signalhound
      POSTGRES_PASSWORD: signalhound
    ports:
      - "5432:5432"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalhound -d signalhound"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        AMASS_VERSION: ${AMASS_VERSION:-5.1.1}
        NUCLEI_VERSION: ${NUCLEI_VERSION:-3.11.1}
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://signalhound:signalhound@postgres:5432/signalhound
      REDIS_URL: redis://redis:6379/0
      SEGMENTATION_EXECUTION_ENABLED: ${SEGMENTATION_EXECUTION_ENABLED:-false}
      SEGMENTATION_SOURCES_JSON: ${SEGMENTATION_SOURCES_JSON:-[]}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      SCANNER_EXECUTION_ENABLED: ${SCANNER_EXECUTION_ENABLED:-false}
      SCANNER_TIMEOUT_SECONDS: ${SCANNER_TIMEOUT_SECONDS:-300}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-900}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-840}
    ports:
      - "8010:8000"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      args:
        AMASS_VERSION: ${AMASS_VERSION:-5.1.1}
        NUCLEI_VERSION: ${NUCLEI_VERSION:-3.11.1}
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://signalhound:signalhound@postgres:5432/signalhound
      REDIS_URL: redis://redis:6379/0
      SEGMENTATION_EXECUTION_ENABLED: ${SEGMENTATION_EXECUTION_ENABLED:-false}
      SEGMENTATION_SOURCES_JSON: ${SEGMENTATION_SOURCES_JSON:-[]}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      SCANNER_EXECUTION_ENABLED: ${SCANNER_EXECUTION_ENABLED:-false}
      SCANNER_TIMEOUT_SECONDS: ${SCANNER_TIMEOUT_SECONDS:-300}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-900}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-840}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010/api/v1}
    ports:
      - "8011:80"
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    depends_on:
      - backend

volumes:
  postgres-data:
